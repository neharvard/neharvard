<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="14" fill="#12141c"/>

  <!-- desk -->
  <rect x="0" y="205" width="400" height="55" fill="#262a35"/>
  <rect x="0" y="205" width="400" height="4" fill="#3a3f4d"/>

  <!-- monitor -->
  <rect x="118" y="60" width="150" height="115" rx="8" fill="#3a3f4d" stroke="#1b1e26" stroke-width="4"/>
  <rect x="130" y="72" width="126" height="86" fill="#081810"/>
  <rect x="176" y="182" width="36" height="18" fill="#3a3f4d"/>
  <rect x="150" y="198" width="88" height="10" rx="3" fill="#3a3f4d"/>

  <!-- terminal text lines, animated to look like typing -->
  <rect x="140" y="82" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;70;70;0" keyTimes="0;0.2;0.8;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="140" y="94" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;95;95;0" keyTimes="0;0.25;0.85;1" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="140" y="106" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;55;55;0" keyTimes="0;0.2;0.8;1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="140" y="118" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;100;100;0" keyTimes="0;0.3;0.85;1" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="140" y="130" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;40;40;0" keyTimes="0;0.15;0.8;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- blinking cursor -->
  <rect x="145" y="142" width="8" height="8" fill="#3ddc84">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- screen glow -->
  <rect x="118" y="60" width="150" height="115" rx="8" fill="#3ddc84" opacity="0.05">
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- chair -->
  <rect x="38" y="150" width="16" height="70" rx="4" fill="#1b1e26"/>

  <!-- person: torso -->
  <path d="M50 210 Q48 150 78 140 Q112 132 118 165 Q120 195 108 210 Z" fill="#0b0d13"/>

  <!-- person: neck + head -->
  <circle cx="96" cy="118" r="20" fill="#0b0d13"/>

  <!-- hijab drape covering head and flowing down the back -->
  <path d="M74 104
           Q78 82 100 80
           Q124 82 122 108
           Q122 118 116 126
           Q128 132 130 156
           Q132 182 118 208
           Q108 214 100 208
           Q112 180 108 158
           Q104 138 92 132
           Q76 128 72 112
           Q72 106 74 104 Z" fill="#7a1f2b"/>

  <!-- face hint (soft, minimal) -->
  <circle cx="103" cy="120" r="1.6" fill="#e8d9c8"/>

  <!-- arm + typing hand (animated bounce) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.5s" repeatCount="indefinite"/>
    <path d="M112 158 Q140 150 150 165 Q156 172 150 176 Q136 168 116 170 Z" fill="#0b0d13"/>
    <circle cx="150" cy="172" r="6" fill="#0b0d13"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -2; 0 1; 0 -2" dur="0.45s" begin="0.15s" repeatCount="indefinite"/>
    <path d="M110 166 Q150 168 175 176 Q182 180 178 185 Q150 180 108 178 Z" fill="#0b0d13"/>
    <circle cx="178" cy="181" r="6" fill="#0b0d13"/>
  </g>

  <!-- keyboard -->
  <rect x="130" y="184" width="90" height="14" rx="3" fill="#1b1e26"/>
</svg>
