<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="320" rx="16" fill="#181025"/>
  <rect width="480" height="320" rx="16" fill="#7A1F2B" opacity="0.05"/>

  <!-- desk -->
  <rect x="0" y="255" width="480" height="65" fill="#241a2e"/>
  <rect x="0" y="255" width="480" height="4" fill="#3a2a44"/>

  <!-- monitor -->
  <rect x="40" y="70" width="220" height="160" rx="10" fill="#4a3d55" stroke="#241a2e" stroke-width="5"/>
  <rect x="56" y="86" width="188" height="118" fill="#081410"/>
  <rect x="130" y="234" width="40" height="22" fill="#4a3d55"/>
  <rect x="95" y="254" width="110" height="12" rx="4" fill="#4a3d55"/>
  <circle cx="230" cy="216" r="4" fill="#3ddc84" opacity="0.7"/>

  <!-- terminal text, animated -->
  <rect x="66" y="98" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;80;80;0" keyTimes="0;0.2;0.8;1" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="66" y="112" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;120;120;0" keyTimes="0;0.25;0.85;1" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="66" y="126" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;60;60;0" keyTimes="0;0.2;0.8;1" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="66" y="140" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;140;140;0" keyTimes="0;0.3;0.85;1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="66" y="154" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;50;50;0" keyTimes="0;0.15;0.8;1" dur="3.4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="66" y="168" width="0" height="6" fill="#3ddc84">
    <animate attributeName="width" values="0;100;100;0" keyTimes="0;0.2;0.85;1" dur="3.4s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <!-- blinking cursor -->
  <rect x="70" y="182" width="8" height="8" fill="#3ddc84">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- screen glow pulse -->
  <rect x="56" y="86" width="188" height="118" fill="#3ddc84" opacity="0.04">
    <animate attributeName="opacity" values="0.02;0.07;0.02" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- person: shoulders / back garment -->
  <path d="M290 320 Q286 240 320 220 Q360 200 405 218 Q440 232 448 270 Q452 300 448 320 Z" fill="#4a4552"/>

  <!-- neck -->
  <rect x="352" y="168" width="26" height="30" rx="8" fill="#e8bfa0"/>

  <!-- head base -->
  <circle cx="368" cy="150" r="34" fill="#e8bfa0"/>

  <!-- hijab drape, covering head, framing face, flowing down the back -->
  <path d="M330 128
           Q334 96 368 92
           Q404 94 406 128
           Q407 142 400 156
           Q392 150 386 154
           Q400 160 406 176
           Q414 200 410 232
           Q406 268 392 296
           Q380 306 366 300
           Q382 266 384 232
           Q386 200 372 178
           Q358 168 344 172
           Q328 158 328 138
           Q328 132 330 128 Z" fill="#7A1F2B"/>

  <!-- hijab fold shading -->
  <path d="M344 172 Q358 168 372 178 Q382 196 383 218" fill="none" stroke="#5c1620" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M392 296 Q382 266 384 232" fill="none" stroke="#5c1620" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- ear/face hint -->
  <circle cx="386" cy="154" r="5" fill="#e8bfa0"/>
  <circle cx="345" cy="146" r="1.8" fill="#3a2a20"/>

  <!-- arms + typing hands, animated -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.5s" repeatCount="indefinite"/>
    <path d="M300 214 Q265 218 250 232 Q244 238 250 244 Q268 234 302 226 Z" fill="#4a4552"/>
    <ellipse cx="248" cy="238" rx="9" ry="7" fill="#e8bfa0"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -2; 0 1; 0 -2" dur="0.45s" begin="0.15s" repeatCount="indefinite"/>
    <path d="M310 226 Q270 236 220 248 Q212 251 214 258 Q262 250 312 236 Z" fill="#4a4552"/>
    <ellipse cx="216" cy="253" rx="9" ry="7" fill="#e8bfa0"/>
  </g>

  <!-- keyboard -->
  <rect x="150" y="228" width="130" height="16" rx="4" fill="#241a2e"/>
</svg>
